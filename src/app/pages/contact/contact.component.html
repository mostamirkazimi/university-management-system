
<div class="container mx-auto w-[900px] bg-teal-600 py-10 px-20  mt-10 mb-10 rounded-lg">
    <h2 class="text-center text-white">CONTACT US</h2>
    <p class="text-center text-white">Please Enter Your Information</p>
    <div class="p-10 bg-white text-black mt-10 ">
        <form action="" #form="ngForm">
            <h3 class="text-xl mb-4">Name</h3>
            <p class="text-xl mb-4"><input type="text" name="name" required maxlength="20" minlength="3" class="w-full p-5 border-2 border-gray-500 rounded-lg"></p>
            
            <!-- @if(name?.touched){
                @if(name?.errors?.['required']){
                    <span class="text-red-700">Fiald is required!</span>
                   }
                @if(name?.errors?.["minlength"]){
                    <span class="text-red-700">Min length is 3</span>
                }

                @if(name?.errors?.["maxlength"]){
                    <span class="text-red-700">Max length is 20</span>
                }
               }  -->
            <h3 class="text-xl mb-4">Email</h3>
            <p class="text-xl mb-4"><input type="email" class="w-full p-5 border-2 border-gray-500 rounded-lg"></p>

            <h3 class="text-xl mb-4">Massage</h3>
            <textarea name="" id="" class="text-xl mb-4 w-full p-5 border-2 border-gray-500 rounded-lg h-60"></textarea>
            
            <p>
                <button class=" px-10 py-5 bg-teal-600 mb-4 mr-4">Send Massage</button>
                <button class=" px-10 py-5 bg-teal-600 mb-4">Reset Massage</button>
            </p>
        </form>
    </div>
</div>
